name: Auto-merge Claude Code branch into main

# Vercel is connected to this repo and deploys automatically on every
# push to `main`. Claude Code develops on
# `claude/parashari-astrology-app-32c7gj` (never directly on `main`).
#
# IMPORTANT: this workflow used to run automatically on every push to
# that branch, which meant every code change silently triggered a
# Vercel production deployment and consumed Vercel credits. Per
# explicit user instruction, automatic deploys are now disabled:
# this workflow only runs when manually triggered (workflow_dispatch),
# e.g. from the GitHub Actions tab, or by Claude Code after the user
# has explicitly confirmed they want to deploy to production.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  merge-to-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Merge Claude Code branch into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin claude/parashari-astrology-app-32c7gj
          git merge --no-ff origin/claude/parashari-astrology-app-32c7gj \
            -m "Auto-merge claude/parashari-astrology-app-32c7gj into main [skip ci]"
          git push origin main
